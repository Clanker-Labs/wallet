# docker compose up -d   → web on :3000 + Telegram worker, sharing one SQLite volume.
services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      WALLET_DB_PATH: /data/wallet.db
    ports:
      - "3000:3000"
    volumes:
      - wallet-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      WALLET_DB_PATH: /data/wallet.db
    command: ["node", "node_modules/tsx/dist/cli.mjs", "src/bin/worker.ts"]
    volumes:
      - wallet-data:/data
    depends_on:
      - web

volumes:
  wallet-data:

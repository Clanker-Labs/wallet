<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Telegram replay</title>
<style>
  @font-face { font-family: "Inter"; src: url("/__demo/inter-latin.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Inter"; src: url("/__demo/inter-latin-ext.woff2") format("woff2"); font-weight: 100 900; unicode-range: U+0100-02BA, U+1E00-1EFF, U+20A0-20C0; }
  :root {
    --brand: #5b4fe9;
    --page: #f5f6fa;
    --tg-blue: #3390ec;
    --in: #ffffff;
    --out: #eeffde;
    --out-meta: #4fae4e;
    --meta: #8a96a3;
    --ink: #0f1419;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page);
    font-family: Inter, "Noto Color Emoji", system-ui, sans-serif;
    font-feature-settings: "cv11", "ss01";
    color: var(--ink);
    overflow: hidden;
  }
  /* Branded backdrop: soft indigo glows behind the phone. */
  .backdrop {
    position: fixed; inset: 0;
    background:
      radial-gradient(520px 420px at 22% 30%, rgba(91, 79, 233, .14), transparent 70%),
      radial-gradient(520px 420px at 80% 75%, rgba(139, 92, 246, .12), transparent 70%),
      var(--page);
  }
  .brand { position: fixed; left: 34px; top: 28px; display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 21px; letter-spacing: -.025em; color: #111827; }
  .brand small { display: block; font-size: 13px; font-weight: 500; color: #6b7280; letter-spacing: 0; margin-top: 2px; }
  .stage { position: fixed; inset: 0; display: flex; justify-content: center; padding-top: 14px; }
  .phone {
    position: relative; width: 420px; height: 602px; border-radius: 30px; overflow: hidden;
    display: flex; flex-direction: column; background: #fff;
    box-shadow: 0 30px 70px rgba(30, 27, 75, .22), 0 6px 18px rgba(30, 27, 75, .12), 0 0 0 1px rgba(17, 24, 39, .06);
  }
  .header { flex: none; height: 60px; display: flex; align-items: center; gap: 11px; padding: 0 14px 0 8px; background: #fff; border-bottom: 1px solid #e7e9ef; z-index: 2; }
  .back { width: 26px; height: 26px; color: var(--tg-blue); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; flex: none; }
  .who { min-width: 0; flex: 1; }
  .name { font-weight: 650; font-size: 16px; line-height: 1.2; }
  .status { font-size: 13px; color: var(--meta); line-height: 1.3; height: 17px; }
  .status.typing { color: var(--tg-blue); }
  .hdr-icons { display: flex; gap: 16px; color: #8a96a3; }
  .hdr-icons svg { width: 22px; height: 22px; }

  .chat {
    position: relative; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px 10px 8px; scroll-behavior: auto;
    display: flex; flex-direction: column; gap: 3px;
    background-color: #dfe3f4;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,.55) 0 1.4px, transparent 1.6px),
      radial-gradient(circle at 70% 60%, rgba(91,79,233,.10) 0 1.6px, transparent 1.8px),
      linear-gradient(160deg, #e7e9f8 0%, #dcdff3 45%, #e3dcf3 100%);
    background-size: 26px 26px, 34px 34px, 100% 100%;
  }
  .chat::-webkit-scrollbar { display: none; }
  .spacer { flex: 1 0 auto; }
  .date { align-self: center; margin: 8px 0 6px; padding: 3px 10px; border-radius: 12px; font-size: 13px; font-weight: 550; color: #fff; background: rgba(66, 72, 120, .38); }
  .row { display: flex; flex-direction: column; animation: pop .26s cubic-bezier(.2,.8,.3,1) both; }
  .row.out { align-items: flex-end; }
  .row.in { align-items: flex-start; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
  .bubble {
    position: relative; max-width: 86%; padding: 6px 10px 7px 11px; border-radius: 15px; font-size: 14.5px; line-height: 1.4;
    white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 1px 1.5px rgba(17, 24, 39, .13);
  }
  .in .bubble { background: var(--in); border-bottom-left-radius: 5px; }
  .out .bubble { background: var(--out); border-bottom-right-radius: 5px; }
  .bubble b { font-weight: 650; }
  .bubble code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; color: #c3274f; }
  .bubble pre { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; margin: 4px 0; }
  .bubble a { color: var(--tg-blue); text-decoration: none; }
  .meta { float: right; position: relative; top: 7px; margin-left: 10px; font-size: 11.5px; color: var(--meta); white-space: nowrap; line-height: 1; }
  .out .meta { color: var(--out-meta); }
  .meta svg { width: 16px; height: 11px; vertical-align: -1px; margin-left: 2px; }

  .kb { display: grid; gap: 4px; width: 86%; margin-top: 4px; transition: opacity .3s, max-height .35s; max-height: 200px; overflow: hidden; }
  .kb.gone { opacity: 0; max-height: 0; margin: 0; }
  .kb-row { display: grid; gap: 4px; }
  .kb button {
    font: 600 13.5px/1.2 Inter, "Noto Color Emoji", system-ui, sans-serif; color: #fff; border: 0; border-radius: 10px; height: 38px; padding: 0 6px;
    background: rgba(66, 72, 120, .42); backdrop-filter: blur(6px); cursor: pointer; transition: background .15s, transform .1s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .kb button.pressed { background: rgba(66, 72, 120, .68); transform: scale(.97); }

  .file { display: flex; gap: 10px; align-items: center; min-width: 230px; padding: 2px 0 3px; }
  .file-icon { width: 46px; height: 46px; border-radius: 50%; background: #4fae4e; display: grid; place-items: center; flex: none; }
  .file-icon svg { width: 22px; height: 22px; color: #fff; }
  .file-name { font-weight: 600; font-size: 14.5px; }
  .file-size { font-size: 12.5px; color: var(--out-meta); margin-top: 1px; }
  .caption-text { margin-top: 5px; }

  .typing-bubble { display: inline-flex; gap: 4px; padding: 12px 14px; }
  .typing-bubble i { width: 7px; height: 7px; border-radius: 50%; background: #9aa5b1; animation: blink 1.2s infinite both; }
  .typing-bubble i:nth-child(2) { animation-delay: .2s; }
  .typing-bubble i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }

  .composer { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #fff; border-top: 1px solid #e7e9ef; z-index: 2; }
  .composer .icon { width: 26px; height: 26px; color: #8a96a3; flex: none; }
  .input { flex: 1; min-width: 0; height: 38px; border-radius: 19px; background: #f1f3f6; display: flex; align-items: center; padding: 0 14px; font-size: 15px; white-space: nowrap; overflow: hidden; }
  .input .ph { color: #9aa5b1; }
  .input .caret { display: inline-block; width: 1.5px; height: 18px; background: var(--tg-blue); margin-left: 1px; animation: caret 1s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
  .send { width: 38px; height: 38px; border-radius: 50%; border: 0; display: grid; place-items: center; background: transparent; color: #8a96a3; flex: none; transition: background .15s, color .15s; }
  .send.ready { background: var(--tg-blue); color: #fff; }
  .send svg { width: 22px; height: 22px; }

  .toast {
    position: absolute; left: 50%; top: 74px; z-index: 5; transform: translate(-50%, -8px); opacity: 0; pointer-events: none;
    padding: 9px 14px; border-radius: 12px; background: rgba(28, 31, 42, .88); color: #fff; font-size: 14px; font-weight: 550; white-space: nowrap;
    transition: opacity .2s, transform .2s;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="brand">
  <svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true">
    <defs>
      <linearGradient id="lg" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7f75ff"/><stop offset=".55" stop-color="#5b4fe9"/><stop offset="1" stop-color="#3b30c4"/></linearGradient>
    </defs>
    <rect width="64" height="64" rx="15" fill="url(#lg)"/>
    <path d="M14 23 L22.5 42 L32 28 L41.5 42 L50 19" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="19" r="4.6" fill="#f5c451"/>
  </svg>
  <div>wallet<small>Telegram bot</small></div>
</div>

<div class="stage">
  <div class="phone">
    <div class="header">
      <svg class="back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      <div class="avatar">
        <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true">
          <defs><linearGradient id="la" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7f75ff"/><stop offset=".55" stop-color="#5b4fe9"/><stop offset="1" stop-color="#3b30c4"/></linearGradient></defs>
          <rect width="64" height="64" fill="url(#la)"/>
          <path d="M14 23 L22.5 42 L32 28 L41.5 42 L50 19" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="50" cy="19" r="4.6" fill="#f5c451"/>
        </svg>
      </div>
      <div class="who">
        <div class="name" id="bot-name">Wallet</div>
        <div class="status" id="status">bot</div>
      </div>
      <div class="hdr-icons">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5.5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="18.5" r="1.7"/></svg>
      </div>
    </div>
    <div class="toast" id="toast"></div>
    <div class="chat" id="chat"><div class="spacer"></div></div>
    <div class="composer">
      <svg class="icon" id="attach" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.5l-8.4 8.4a5 5 0 01-7.1-7.1l8.4-8.4a3.3 3.3 0 014.7 4.7l-8.4 8.4a1.7 1.7 0 01-2.4-2.4l7.8-7.8"/></svg>
      <div class="input" id="input"><span class="ph">Message</span></div>
      <button class="send" id="send" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.4-7.5c.8-.4.8-1.5 0-1.8L3.4 3.6c-.7-.3-1.4.3-1.3 1l.9 5.6c.1.5.5.9 1 .9l9 .9-9 .9c-.5.1-.9.4-1 .9l-.9 5.6c-.1.7.6 1.3 1.3 1z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
(() => {
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const status = document.getElementById("status");
  const toastEl = document.getElementById("toast");
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const ALLOWED = new Set(["B", "STRONG", "I", "EM", "U", "S", "CODE", "PRE", "A"]);
  const CHECKS = '<svg viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6l3 3 6-7"/><path d="M6.5 8.6L7 9l6-7"/></svg>';

  /** Telegram HTML → DOM, keeping only the tags Telegram allows. */
  function telegramHtml(html) {
    const t = document.createElement("template");
    t.innerHTML = html;
    const clean = (node) => {
      for (const child of [...node.childNodes]) {
        if (child.nodeType === 1) {
          if (!ALLOWED.has(child.tagName)) {
            child.replaceWith(document.createTextNode(child.textContent));
            continue;
          }
          for (const a of [...child.attributes]) if (!(child.tagName === "A" && a.name === "href")) child.removeAttribute(a.name);
          clean(child);
        }
      }
    };
    clean(t.content);
    return t.content;
  }

  /** Scroll to `to` (px, or the bottom); resolves when done. */
  function scrollTo(to, ms = 380) {
    const bottom = () => chat.scrollHeight - chat.clientHeight;
    if (!ms) { chat.scrollTop = to ?? bottom(); return Promise.resolve(); }
    return new Promise((done) => {
      const from = chat.scrollTop, t0 = performance.now();
      const step = (t) => {
        const k = Math.min(1, (t - t0) / ms);
        const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        chat.scrollTop = from + ((to ?? bottom()) - from) * e;
        if (k < 1) requestAnimationFrame(step);
        else done();
      };
      requestAnimationFrame(step);
    });
  }
  /** Bring a new row into view: the bottom, or its top when it's taller than the chat. */
  function reveal(row, smooth = true) {
    const tall = row && row.offsetHeight > chat.clientHeight - 24;
    return scrollTo(tall ? row.offsetTop - 10 : null, smooth ? 380 : 0);
  }
  const scrollDown = (smooth = true) => scrollTo(null, smooth ? 380 : 0);

  function addRow(cls, inner, opts = {}) {
    const row = document.createElement("div");
    row.className = `row ${cls}`;
    if (opts.id !== undefined) row.dataset.id = opts.id;
    if (opts.instant) row.style.animation = "none";
    row.append(inner);
    chat.append(row);
    reveal(row, !opts.instant);
    return row;
  }

  function meta(time, out) {
    const m = document.createElement("span");
    m.className = "meta";
    m.innerHTML = time + (out ? CHECKS : "");
    return m;
  }

  function keyboard(rows, messageId) {
    const kb = document.createElement("div");
    kb.className = "kb";
    kb.dataset.for = messageId;
    for (const r of rows) {
      const row = document.createElement("div");
      row.className = "kb-row";
      row.style.gridTemplateColumns = `repeat(${r.length}, 1fr)`;
      for (const b of r) {
        const btn = document.createElement("button");
        btn.textContent = b.text;
        btn.dataset.label = b.text;
        btn.addEventListener("click", () => {
          btn.classList.add("pressed");
          setTimeout(() => btn.classList.remove("pressed"), 550);
        });
        row.append(btn);
      }
      kb.append(row);
    }
    return kb;
  }

  let typingRow = null;
  function setTyping(on) {
    status.textContent = on ? "typing…" : "bot";
    status.classList.toggle("typing", on);
    if (on && !typingRow) {
      const b = document.createElement("div");
      b.className = "bubble typing-bubble";
      b.innerHTML = "<i></i><i></i><i></i>";
      typingRow = addRow("in", b);
    } else if (!on && typingRow) {
      typingRow.remove();
      typingRow = null;
    }
  }

  let draft = "";
  function renderInput() {
    input.innerHTML = "";
    if (!draft) {
      input.innerHTML = '<span class="ph">Message</span>';
      send.classList.remove("ready");
      return;
    }
    input.append(document.createTextNode(draft));
    const caret = document.createElement("span");
    caret.className = "caret";
    input.append(caret);
    send.classList.add("ready");
  }

  window.replay = {
    date(label, opts = {}) {
      const d = document.createElement("div");
      d.className = "date";
      d.textContent = label;
      if (!opts.instant) d.style.animation = "pop .26s both";
      chat.append(d);
      scrollDown(!opts.instant);
    },
    async bot(ev, opts = {}) {
      if (opts.typingMs) {
        setTyping(true);
        await sleep(opts.typingMs);
      }
      setTyping(false);
      const wrap = document.createDocumentFragment();
      const b = document.createElement("div");
      b.className = "bubble";
      b.append(telegramHtml(ev.html), meta(ev.time, false));
      wrap.append(b);
      const row = addRow("in", b, { id: ev.id, instant: opts.instant });
      if (ev.keyboard?.length) row.append(keyboard(ev.keyboard, ev.id));
      reveal(row, !opts.instant);
      return ev.id;
    },
    async type(text, perChar = 45) {
      draft = "";
      for (const ch of text) {
        draft += ch;
        renderInput();
        await sleep(perChar);
      }
    },
    sendText(ev) {
      draft = "";
      renderInput();
      const b = document.createElement("div");
      b.className = "bubble";
      b.append(document.createTextNode(ev.text), meta(ev.time, true));
      addRow("out", b, { id: ev.id });
    },
    sendFile(ev) {
      draft = "";
      renderInput();
      const b = document.createElement("div");
      b.className = "bubble";
      const ext = ev.file.name.split(".").pop().toUpperCase();
      b.innerHTML = `<div class="file"><div class="file-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg></div><div><div class="file-name"></div><div class="file-size"></div></div></div>`;
      b.querySelector(".file-name").textContent = ev.file.name;
      b.querySelector(".file-size").textContent = `${ev.file.size < 1024 ? ev.file.size + " B" : Math.round(ev.file.size / 1024) + " KB"} · ${ext}`;
      if (ev.caption) {
        const c = document.createElement("div");
        c.className = "caption-text";
        c.textContent = ev.caption;
        b.append(c);
      }
      b.append(meta(ev.time, true));
      addRow("out", b, { id: ev.id });
    },
    async toast(text, ms = 1400) {
      toastEl.textContent = text;
      toastEl.classList.add("on");
      await sleep(ms);
      toastEl.classList.remove("on");
    },
    removeKeyboard(id) {
      for (const kb of chat.querySelectorAll(`.kb[data-for="${id}"]`)) kb.classList.add("gone");
    },
    typing: setTyping,
    /** Slowly scroll to the bottom (to read a tall message). */
    scrollToBottom: (ms = 1500) => scrollTo(null, ms),
    /** Selector of a keyboard button, for the recorder's cursor. */
    buttonSelector(id, label) {
      const kb = [...chat.querySelectorAll(`.kb[data-for="${id}"]`)].at(-1);
      const btn = kb && [...kb.querySelectorAll("button")].find((b) => b.dataset.label === label);
      if (!btn) return null;
      btn.id = btn.id || `btn-${id}-${Math.random().toString(36).slice(2, 7)}`;
      return `#${btn.id}`;
    },
  };
})();
</script>
</body>
</html>
